[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cwi-platform"
version = "2.0.0"
description = "Automated Caption with Intention Real-Time & Offline Expressive Subtitle Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "websockets>=13.0",
    "pydantic>=2.8.2",
    "numpy>=1.26.4,<2.0.0",
    "scipy>=1.13.1",
    "librosa>=0.10.2.post1",
    "soundfile>=0.12.1",
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
    "transformers>=4.44.2",
    "ctranslate2>=4.4.0",
    "faster-whisper>=1.0.3",
    "silero-vad>=5.1",
    "funasr>=1.1.9",
    "modelscope>=1.18.0",
    "scikit-learn>=1.5.1",
    "pyyaml>=6.0.2",
    "onnx>=1.16.2",
    "onnxruntime>=1.19.0",
]

[project.optional-dependencies]
nemo = [
    "nemo_toolkit[asr]>=2.0.0",
    "hydra-core>=1.3.2",
    "pytorch-lightning>=2.3.0",
]
apple_silicon = [
    "mlx>=0.18.0",
    "coremltools>=8.0",
    "pywhispercpp>=1.2.0",
]
separation = [
    "demucs>=4.0.1",
]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "jsonschema>=4.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
