# Hyperparameters for Emotion2Vec+ Multi-Task Head (~0.8M params)
# Multi-task objective:
#   1. Frame-level continuous Valence/Arousal/Dominance (normalized SAM scale [0.0, 1.0])
#   2. Utterance-level 7-class human non-speech vocalizations (VocalSound + Nonspeech7k)
#   3. Frame-level vocal strain/texture contrast driving Roboto Flex XOPQ & YOPQ axes
# References: emotion2vec+ Large (ISCA 2024 / IEEE 2026), CWI Platform Architecture.

model:
  name: "emotion2vec_multitask_head"
  embed_dim: 1024       # 1024 for emotion2vec_plus_large; 768 for emotion2vec_plus_base
  hidden_dim: 256
  num_vocal_classes: 7
  dropout: 0.1
  trainable_params_target: "~0.8M"

backbone:
  large_id: "emotion2vec/emotion2vec_plus_large"
  base_id: "emotion2vec/emotion2vec_plus_base"
  web_id: "thomashallock/emotion2vec-web-distill"
  freeze_backbone: true
  sampling_rate: 16000
  frame_rate_hz: 50      # 20ms frame stride
  max_frames_50hz: 250   # 5.0 second max temporal window

vocalization_classes:
  - "laughter"
  - "sighs"
  - "gasps"
  - "crying"
  - "coughing"
  - "screaming"
  - "yawning"

training:
  optimizer: "AdamW"
  lr: 0.0005             # 5e-4 on pre-extracted .npy features; 5e-5 for end-to-end
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01
  warmup_ratio: 0.1
  epochs: 15
  batch_size: 64
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0

  # Multi-task loss combination
  loss_weights:
    vad_loss_weight: 1.0       # MSE loss for normalized [0, 1] Valence/Arousal/Dominance
    vocal_loss_weight: 1.0     # CrossEntropyLoss for 7 vocalization classes
    texture_loss_weight: 0.5   # Regularization / supervised strain loss

datasets:
  # Naturalistic conversational training (avoids acted domain-mismatch)
  naturalistic_vad: "MSP-Podcast v2.0"
  naturalistic_tv: "MELD"
  # Non-speech vocalizations
  vocal_sound: "VocalSound"
  nonspeech7k: "Nonspeech7k"
  # Strictly post-training intensity calibration sets:
  calibration_crema_d: "CREMA-D"
  calibration_ravdess: "RAVDESS"

paths:
  features_dir: "data/features_50hz"
  manifest_train: "data/manifests/affect_train.jsonl"
  manifest_val: "data/manifests/affect_val.jsonl"
  save_dir: "weights"
  checkpoint_file: "emotion2vec_multitask_head.pt"
  onnx_export_dir: "weights/onnx"
